name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ArtefgoMetro-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ArtefgoMetro.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ArtefgoMetro.apk --title "Artefgo Metro (última versión)" --notes "APK compilado automáticamente desde main. Instálalo en la radio desde una USB."
